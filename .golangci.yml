version: "2"

run:
  timeout: 15m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  exclusions:
    generated: lax
    paths:
      # reason: frontend/node_modules vendors third-party Go sources (e.g.
      # flatted/golang). The go tool skips node_modules directories entirely, so
      # these files are not part of this module and are never built or tested.
      # golangci-lint does not apply that skip, so exclude them explicitly.
      - frontend/node_modules

    rules:
      # reason: LiteAPI must speak the v1alpha gRPC server-reflection protocol to
      # interoperate with older gRPC servers that never implemented reflection v1.
      # The v1 API is not a drop-in for those peers, so the deprecated v1alpha
      # message types are load-bearing compatibility code, not an oversight.
      # Scoped to the reflection helpers by path + message text.
      #
      # Re-anchored from ^app\.go$: this code moved to internal/grpcexec during
      # the package extraction and the exclusion did not follow it, so all 17
      # findings had been firing unsuppressed. A path anchor does not fail when
      # it stops matching — it just silently stops suppressing.
      - path: ^internal/grpcexec/grpcexec\.go$
        linters: [staticcheck]
        text: 'SA1019: .*grpc/reflection/v1alpha/reflection\.proto is marked as deprecated'

      # reason: required to load legacy RFC-1423-encrypted client-certificate keys
      # that users already have on disk. Go deprecated these without providing a
      # replacement, so refusing such keys would drop a working feature.
      # Re-anchored from ^app\.go$ — moved to internal/transport.
      - path: ^internal/transport/transport\.go$
        linters: [staticcheck]
        text: 'SA1019: x509\.(IsEncryptedPEMBlock|DecryptPEMBlock) has been deprecated'

      # reason: this test fixture must generate a legacy-format PKCS#12 bundle in
      # order to exercise the legacy client-certificate import path. Using
      # Modern.Encode here would stop testing the code path that exists to read
      # bundles produced by older tooling.
      - path: ^internal/core/app_test\.go$
        linters: [staticcheck]
        text: 'SA1019: pkcs12\.Encode is deprecated'

      # reason: the script runtime's module resolver deliberately reproduces
      # Node.js's own "Cannot find module" error text. User scripts (and the
      # embedded conformance tests in app_test.go, e.g. `expect(...).to.throw(
      # "Cannot find module")`) match on that exact string, so lowercasing it to
      # satisfy Go's error-string convention would be a compatibility regression.
      # Re-anchored twice: from ^app\.go$ when the code moved to
      # internal/scripting, and again to modules.go when scripting.go was split
      # by domain. Both times the exclusion silently stopped applying and
      # qa/lint-exclusions.sh is what reported it.
      - path: ^internal/scripting/modules\.go$
        linters: [staticcheck]
        text: 'error strings should not be capitalized'
        source: 'Cannot find module'
